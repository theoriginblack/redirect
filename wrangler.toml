# Cloudflare 部署配置（本仓库实际由 Pages 的 Git 集成部署）
#
# 真正生效的是 Pages 控制台里的设置：
#   Settings → Build → Build output directory = /
#   Build command = 空
# 本文件对 Pages 无副作用，仅在你改用 Workers 路线时被读取。

name = "redirect"
compatibility_date = "2026-10-13"

# 发布仓库根目录（网站文件就在根目录）
[assets]
directory = "."

# 没有 main：纯静态资源，不需要 Worker 脚本。
