# Cloudflare 部署配置
#
# 用 Pages（Connect to Git）时：真正生效的是 Pages 项目里的
#   Settings → Build → Build output directory = public
# 本文件对 Pages 无副作用，仅用于 Workers 路线。
#
# 用 Workers 时：[assets] 会指定要上传的静态资源目录。

name = "redirect"
compatibility_date = "2026-10-13"

# 只发布 public/ —— 仓库根目录的 README、配置、原始照片一律不会上线
[assets]
directory = "./public"

# 没有 main：纯静态资源，不需要 Worker 脚本。
